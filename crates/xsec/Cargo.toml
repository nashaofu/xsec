[package]
name = "xsec"
version = "0.0.1"
edition = "2024"
description = "Cross-platform data encryption and key protection library."
license = "Apache-2.0"
repository = "https://github.com/nashaofu/xsec.git"

[features]
default = ["file-storage", "password-protector", "system-protector"]
file-storage = ["dep:tempfile", "tokio/fs"]
password-protector = ["dep:argon2"]
system-protector = [
    "dep:core-foundation",
    "dep:futures-channel",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-local-authentication",
    "dep:secure-types",
    "dep:security-framework",
    "dep:security-framework-sys",
    "dep:windows",
    "dep:windows-future",
    "dep:zbus",
    "dep:zbus_polkit",
]

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"], optional = true }
getrandom = { version = "0.4.3", features = ["std"] }
hkdf = "0.13.0"
hmac = "0.13.0"
secrecy = "0.10.3"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt"] }
tempfile = { version = "3.27.0", optional = true }
zeroize = "1.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", optional = true, features = ["Security_Credentials", "Security_Cryptography", "Foundation", "Storage_Streams"] }
windows-future = { version = "0.2.1", optional = true, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
secure-types = { version = "0.5.0", optional = true }
zbus = { version = "5.16.0", default-features = false, features = ["tokio"], optional = true }
zbus_polkit = { version = "5.1.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10.1", optional = true }
futures-channel = { version = "0.3.31", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "std"], optional = true }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext"], optional = true }
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"], optional = true }
security-framework-sys = { version = "2.17.0", default-features = false, features = ["OSX_10_15"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }

[[example]]
name = "password"
required-features = ["file-storage", "password-protector"]

[[example]]
name = "system"
required-features = ["file-storage", "system-protector"]
